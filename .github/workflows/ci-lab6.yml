name: ci-lab6
on:
  push:
    branches: ["ci/lab6-**"]
permissions:
  contents: read
jobs:
  slim:
    runs-on: ubuntu-slim
    steps:
      - run: |
          for t in python3 jq gh git curl bash node; do printf '%s: ' "$t"; command -v "$t" || echo missing; done
          python3 -c "import yaml; print('pyyaml', yaml.__version__)" || echo "pyyaml missing"
          python3 --version; nproc; free -m | head -2
