name: ci-lab12
# Fork-only: where does a Clang build spend its time? -ftime-trace for every translation unit, summarised by ClangBuildAnalyzer.
on:
  push:
    branches: ["ci/lab12-**"]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
defaults:
  run:
    shell: bash
jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Targeted submodules
        run: scripts/ci/init-submodules.sh windows
      - name: Defender exclusions
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath 'C:\msys64', "$env:GITHUB_WORKSPACE", 'D:\a', $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess 'gcc.exe','g++.exe','cc1plus.exe','cc1.exe','clang.exe','clang++.exe','as.exe','ld.exe','ld.lld.exe','ninja.exe','ccache.exe','cmake.exe','pacman.exe','bash.exe','git.exe'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          release: false
          update: true
          install: wget
      - name: Toolchain
        shell: msys2 {0}
        run: |
          opus_tarball="mingw-w64-ucrt-x86_64-opus-1.6.1-1-any.pkg.tar.zst"
          wget -q https://repo.msys2.org/mingw/ucrt64/${opus_tarball}
          P=mingw-w64-ucrt-x86_64
          pacman -S --noconfirm --needed git diffutils $P-cmake $P-ninja $P-gcc $P-clang $P-lld $P-binutils $P-crt-git $P-headers-git $P-winpthreads-git \
            $P-pkgconf $P-make $P-cppwinrt $P-curl-winssl $P-MinHook $P-miniupnpc $P-nlohmann-json $P-libvpl $P-openssl $P-python
          pacman --noconfirm -U ${opus_tarball}
          clang++ --version | head -1; ninja --version
      - name: Configure (clang, -ftime-trace)
        shell: msys2 {0}
        env:
          BRANCH: ci-lab12
          BUILD_VERSION: lab.zayu
          COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_BRANCH: ci-lab12
          SUNSHINE_BUILD_CHANNEL: dev
          SUNSHINE_BUILD_BUILDER: ci
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          cmake -B build -G Ninja -S . -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-ftime-trace" -DCMAKE_C_FLAGS="-ftime-trace" \
            -DBUILD_DOCS=OFF -DSUNSHINE_RTX_HDR=OFF -DBUILD_TESTS=ON -DBUILD_TRAY_TESTS=ON -DBUILD_WEB_UI=OFF -DSUNSHINE_ASSETS_DIR=assets -DDRIVER_DEPS_REQUIRED=OFF > configure.log 2>&1 || { tail -30 configure.log; exit 1; }
      - name: Build (no compiler cache)
        shell: msys2 {0}
        run: |
          start=$(date +%s); ninja -C build -k 0 > build.log 2>&1 || true; echo "cold build wall (clang, -ftime-trace, no ccache): $(( $(date +%s) - start )) s"
          echo "FAILED edges: $(grep -c '^FAILED' build.log || true)"; grep '^FAILED' build.log | head -5
          cp build/.ninja_log ninja_log.txt
          find build -name '*.json' -path '*CMakeFiles*' | wc -l
      - name: ClangBuildAnalyzer
        shell: msys2 {0}
        run: |
          git clone -q --depth 1 https://github.com/aras-p/ClangBuildAnalyzer.git cba
          cmake -S cba -B cba/b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > /dev/null 2>&1 || cmake -S cba -B cba/b -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C cba/b > /dev/null 2>&1 || ninja -C cba/b | tail -5
          cba/b/ClangBuildAnalyzer --all build trace.bin | tail -3
          cba/b/ClangBuildAnalyzer --analyze trace.bin > analysis.txt
          wc -l analysis.txt; sed -n 1,140p analysis.txt | cut -c1-200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab12-trace
          path: |
            analysis.txt
            ninja_log.txt
            build.log
          compression-level: 6
