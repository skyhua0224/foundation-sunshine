name: ci-lab31
# Fork-only: runtime sanity of Clang objects against GCC objects on one VM: the FEC encoder of the stream path built with the
# project's own flags by each compiler, run alternately.
on:
  push:
    branches: ["ci/lab31-**"]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
defaults:
  run:
    shell: bash
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Targeted submodules
        run: scripts/ci/init-submodules.sh windows
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          release: false
          update: true
          install: wget
      - name: Toolchain
        shell: msys2 {0}
        run: |
          opus_tarball="mingw-w64-ucrt-x86_64-opus-1.6.1-1-any.pkg.tar.zst"
          wget -q https://repo.msys2.org/mingw/ucrt64/${opus_tarball}
          P=mingw-w64-ucrt-x86_64
          pacman -S --noconfirm --needed git diffutils $P-cmake $P-ninja $P-gcc $P-clang $P-lld $P-binutils $P-crt-git $P-headers-git $P-winpthreads-git \
            $P-pkgconf $P-make $P-python $P-cppwinrt $P-curl-winssl $P-MinHook $P-miniupnpc $P-nlohmann-json $P-libvpl $P-openssl
          pacman --noconfirm -U ${opus_tarball}
      - name: Build the FEC objects with each compiler and alternate the runs
        shell: msys2 {0}
        env:
          BRANCH: ci-lab31
          BUILD_VERSION: lab.zayu
          COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_BRANCH: ci-lab31
          SUNSHINE_BUILD_CHANNEL: dev
          SUNSHINE_BUILD_BUILDER: ci
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cpu=$(powershell.exe -NoProfile -Command "(Get-CimInstance Win32_Processor | Select -First 1).Name" 2>/dev/null || true); echo "CPU: $cpu"
          common=(-G Ninja -S . -DBUILD_DOCS=OFF -DSUNSHINE_RTX_HDR=OFF -DBUILD_TESTS=ON -DBUILD_TRAY_TESTS=ON -DBUILD_WEB_UI=OFF -DSUNSHINE_ASSETS_DIR=assets -DDRIVER_DEPS_REQUIRED=OFF)
          cmake -B build-gcc "${common[@]}" > cfg-gcc.log 2>&1
          cmake -B build-clang "${common[@]}" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > cfg-clang.log 2>&1
          for t in gcc clang; do
            ninja -C build-$t -t targets all | grep -E "nanors/(rs\.c|deps/obl/[a-z_]+\.c)\.obj:" | cut -d: -f1 | sort -u > objs-$t.txt
            cat objs-$t.txt
            ninja -C build-$t $(cat objs-$t.txt) > obj-$t.log 2>&1
            echo "== $t compile command of rs.c.obj"; ninja -C build-$t -t commands $(grep 'rs\.c\.obj' objs-$t.txt | head -1) | tail -1 | grep -oE ' -(O[0-9sg]|m[a-z0-9=-]+|f[a-z-]+|DNDEBUG|std=[a-z0-9+]+)' | tr '\n' ' '; echo
          done
          gcc -O2 -Ithird-party/nanors tests/lab/fec_bench.c $(sed 's#^#build-gcc/#' objs-gcc.txt) -o bench-gcc.exe
          clang -fuse-ld=lld -O2 -Ithird-party/nanors tests/lab/fec_bench.c $(sed 's#^#build-clang/#' objs-clang.txt) -o bench-clang.exe
          for r in 1 2 3 4 5 6; do for t in gcc clang; do echo "BENCH $t $r $(./bench-$t.exe)"; done; done | tee bench.txt
          python3 - <<'PY'
          import re,statistics,collections
          e=collections.defaultdict(list); d=collections.defaultdict(list)
          for l in open("bench.txt"):
              m=re.match(r"BENCH (\w+) \d+ FEC encode ([0-9.]+) MB/s decode\(4 lost\) ([0-9.]+)",l)
              if m: e[m[1]].append(float(m[2])); d[m[1]].append(float(m[3]))
          for t in e: print(t,"encode median",statistics.median(e[t]),"decode median",statistics.median(d[t]))
          print("clang/gcc encode %.2f decode %.2f"%(statistics.median(e["clang"])/statistics.median(e["gcc"]),statistics.median(d["clang"])/statistics.median(d["gcc"])))
          PY
