name: ci-lab32-n
on:
  workflow_call:
    inputs:
      count: { type: number, required: true }
      indices: { type: string, required: true }
      weights: { type: boolean, required: false, default: false }
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
defaults:
  run:
    shell: bash
jobs:
  shard:
    name: shard ${{ matrix.i }}/${{ inputs.count }}
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(inputs.indices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/lab-prep
      - name: Build this shard's compile outputs
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          set -euo pipefail
          ninja -C build -t commands | python scripts/ci/shard-targets.py ${{ matrix.i }} ${{ inputs.count }} ${{ inputs.weights && 'scripts/ci/shard-weights.ninja_log' || '' }} > shard.txt
          echo "shard outputs: $(wc -l < shard.txt)"
          { echo "ninja_required_version = 1.10"; echo "include build.ninja"; printf 'build lab_shard: phony'; while read -r o; do o=${o%$'\r'}; o=${o//\$/\$\$}; o=${o// /\$ }; o=${o//:/\$:}; printf ' %s' "$o"; done < shard.txt; echo; } > build/shard.ninja
          t0=$(date +%s)
          ninja -C build -f shard.ninja lab_shard
          cp build/.ninja_log ninja_log.shard
          echo "SHARD_BUILD_SECONDS=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ccache --show-stats
          du -sh "$CCACHE_DIR" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ninja-log-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s${{ matrix.i }}
          path: |
            ninja_log.shard
            shard.txt
          compression-level: 1
          retention-days: 3
      - name: Save the compiler cache (cache service)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s${{ matrix.i }}
  final:
    name: final (${{ matrix.transport }}) n=${{ inputs.count }}
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        transport: [cache]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/lab-prep
      - name: Restore shard caches (cache service)
        if: matrix.transport == 'cache'
        shell: bash
        run: echo "restoring through actions/cache"
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache'
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s0
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache'
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s1
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache' && inputs.count > 2
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s2
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache' && inputs.count > 5
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s5
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache' && inputs.count > 4
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s4
      - uses: actions/cache/restore@v6
        if: matrix.transport == 'cache' && inputs.count > 3
        with:
          path: ${{ github.workspace }}\.ccache
          key: lab32-${{ github.run_id }}-${{ github.run_attempt }}-n${{ inputs.count }}${{ inputs.weights && 'w' || 'h' }}-s3
      - name: Build at the merged cache
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_MAXSIZE: 2G
          CCACHE_COMPILERCHECK: content
        run: |
          du -sh "$CCACHE_DIR"
          t0=$(date +%s)
          ninja -C build
          echo "FINAL_BUILD_SECONDS=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
          ccache --show-stats
      - name: Native tests
        shell: msys2 {0}
        run: |
          t0=$(date +%s)
          ctest --test-dir build -j4 --no-tests=error --output-on-failure --timeout 600
          echo "CTEST_SECONDS=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
