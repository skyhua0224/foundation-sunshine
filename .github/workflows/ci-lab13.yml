name: ci-lab13
# Fork-only: compile-speed flags and compiler binaries, measured on one VM with interleaved repeats (no compiler cache).
on:
  push:
    branches: ["ci/lab13-**"]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # translation units that stand for the build: the heavy HTTP/Beast ones, platform code, config, crypto, tests
  TU_SUFFIXES: "src/http/server.cpp src/http/client.cpp src/nvhttp.cpp src/confighttp.cpp src/rtsp.cpp src/stream.cpp src/video.cpp src/config.cpp src/audio.cpp src/process.cpp src/crypto.cpp src/network.cpp src/file_mapping/file_mapping_ws_session.cpp src/platform/windows/misc.cpp src/platform/windows/display_vram.cpp src/nvhttp/pairing.cpp src/confighttp/doctor.cpp src/sparxie/runtime.cpp src/telemetry/telemetry.cpp unit/test_crypto.cpp unit/test_confighttp_routes.cpp tools/test_http_safety.cpp src/display_device/settings.cpp src/webhook/webhook.cpp"
defaults:
  run:
    shell: bash
jobs:
  flags:
    name: flags and compilers (interleaved)
    runs-on: windows-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Targeted submodules
        run: scripts/ci/init-submodules.sh windows
      - name: Defender exclusions
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath 'C:\msys64', "$env:GITHUB_WORKSPACE", 'D:\a', $env:RUNNER_TEMP, 'C:\llvm', 'C:\winlibs'
          Add-MpPreference -ExclusionProcess 'gcc.exe','g++.exe','cc1.exe','cc1plus.exe','clang.exe','clang++.exe','as.exe','ld.exe','ld.lld.exe','ninja.exe','cmake.exe','pacman.exe','bash.exe','git.exe'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          release: false
          update: true
          install: wget
      - name: Toolchain (gcc + clang from MSYS2)
        shell: msys2 {0}
        run: |
          opus_tarball="mingw-w64-ucrt-x86_64-opus-1.6.1-1-any.pkg.tar.zst"
          wget -q https://repo.msys2.org/mingw/ucrt64/${opus_tarball}
          P=mingw-w64-ucrt-x86_64
          pacman -S --noconfirm --needed git diffutils $P-cmake $P-ninja $P-gcc $P-clang $P-lld $P-binutils $P-crt-git $P-headers-git $P-winpthreads-git \
            $P-pkgconf $P-make $P-python $P-cppwinrt $P-curl-winssl $P-MinHook $P-miniupnpc $P-nlohmann-json $P-libvpl $P-openssl
          pacman --noconfirm -U ${opus_tarball}
          g++ --version | head -1; clang++ --version | head -1
          echo "gcc build configuration:"; g++ -v 2>&1 | grep -E "^Configured with" | tr ' ' '\n' | grep -E "^--(enable|with)-(lto|bootstrap|profile|build-config|checking|languages)" | head
          pacman -Qi mingw-w64-ucrt-x86_64-clang | grep -E "^Version|^Build Date|^Packager"
          pacman -Qi mingw-w64-ucrt-x86_64-gcc | grep -E "^Version|^Build Date|^Packager"
      - name: Fetch the official LLVM release of the same version and llvm-mingw
        shell: msys2 {0}
        run: |
          v=$(clang++ --version | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1); echo "msys2 clang $v"
          mkdir -p /c/llvm; cd /c/llvm
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          code=$(curl -sL -o llvm.exe -w '%{http_code}' "$url"); echo "official LLVM installer $code $(stat -c %s llvm.exe 2>/dev/null)"
          if [ "$code" = 200 ]; then 7z x -y -ollvm-official llvm.exe > /dev/null && ls llvm-official/bin | head -5; fi
          mm=$(curl -sL https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['tag_name']);print([a['browser_download_url'] for a in d['assets'] if 'ucrt-x86_64.zip' in a['name'] and 'msvcrt' not in a['name']][0])" 2>/dev/null) || true
          echo "llvm-mingw: $mm"
          u=$(echo "$mm" | sed -n 2p); [ -n "$u" ] && curl -sL -o lm.zip "$u" && 7z x -y -ollvm-mingw lm.zip > /dev/null && ls llvm-mingw | head -3
          true
      - name: Configure one build directory per variant
        shell: msys2 {0}
        env:
          BRANCH: ci-lab13
          BUILD_VERSION: lab.zayu
          COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_COMMIT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SUNSHINE_BUILD_BRANCH: ci-lab13
          SUNSHINE_BUILD_CHANNEL: dev
          SUNSHINE_BUILD_BUILDER: ci
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          common=(-G Ninja -S . -DBUILD_DOCS=OFF -DSUNSHINE_RTX_HDR=OFF -DBUILD_TESTS=ON -DBUILD_TRAY_TESTS=ON -DBUILD_WEB_UI=OFF -DSUNSHINE_ASSETS_DIR=assets -DDRIVER_DEPS_REQUIRED=OFF)
          clang=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++)
          O() { echo "-DCMAKE_C_FLAGS_RELEASE=$1 -DCMAKE_CXX_FLAGS_RELEASE=$1"; }
          declare -A V
          V[gcc-base]=""
          V[gcc-pipe]="-DCMAKE_C_FLAGS=-pipe -DCMAKE_CXX_FLAGS=-pipe"
          V[gcc-ggc]="-DCMAKE_CXX_FLAGS=--param=ggc-min-expand=1000\ --param=ggc-min-heapsize=4194304"
          V[gcc-macro0]="-DCMAKE_CXX_FLAGS=-ftrack-macro-expansion=0"
          V[gcc-O2]="$(O '-O2\ -DNDEBUG')"
          V[gcc-O1]="$(O '-O1\ -DNDEBUG')"
          V[gcc-combo]="-DCMAKE_CXX_FLAGS=-pipe\ -ftrack-macro-expansion=0\ --param=ggc-min-expand=1000\ --param=ggc-min-heapsize=4194304 $(O '-O2\ -DNDEBUG')"
          V[clang-base]="${clang[*]}"
          V[clang-O2]="${clang[*]} $(O '-O2\ -DNDEBUG')"
          V[clang-O1]="${clang[*]} $(O '-O1\ -DNDEBUG')"
          if [ -x /c/llvm/llvm-official/bin/clang++.exe ]; then
            V[llvm-official]="-DCMAKE_C_COMPILER=C:/llvm/llvm-official/bin/clang.exe -DCMAKE_CXX_COMPILER=C:/llvm/llvm-official/bin/clang++.exe -DCMAKE_C_COMPILER_TARGET=x86_64-w64-windows-gnu -DCMAKE_CXX_COMPILER_TARGET=x86_64-w64-windows-gnu -DCMAKE_CXX_FLAGS=--gcc-install-dir=C:/msys64/ucrt64/lib/gcc/x86_64-w64-mingw32/16.2.0"
          fi
          : > variants.txt
          for name in "${!V[@]}"; do
            echo "== configure $name"
            if eval cmake -B "build-$name" "${common[@]}" ${V[$name]} > "configure-$name.log" 2>&1; then echo "$name" >> variants.txt; else echo "configure FAILED for $name"; tail -6 "configure-$name.log"; fi
          done
          sort variants.txt -o variants.txt; echo "variants: $(tr '\n' ' ' < variants.txt)"
      - name: Pick the translation units and warm up
        shell: msys2 {0}
        run: |
          first=$(head -1 variants.txt)
          ninja -C "build-$first" -t targets all > targets.txt
          : > tus.txt
          for s in $TU_SUFFIXES; do
            line=$(grep -E "(^|/)${s//./\\.}\.obj:" targets.txt | grep -v "dir/__/" | head -1 | cut -d: -f1)
            [ -n "$line" ] && echo "$line" >> tus.txt || echo "no object for $s"
          done
          wc -l tus.txt
          # the same object names exist in every directory; build them once per variant (warm-up, not timed) to create generated headers
          for v in $(cat variants.txt); do
            ninja -C "build-$v" -k 0 $(cat tus.txt) > "warm-$v.log" 2>&1 || echo "warm-up failures in $v: $(grep -c '^FAILED' warm-$v.log)"
          done
      - name: Timed passes (3 interleaved repeats)
        shell: msys2 {0}
        run: |
          for r in 1 2 3; do
            for v in $(cat variants.txt); do
              for o in $(cat tus.txt); do rm -f "build-$v/$o"; done
              s=$(date +%s.%N)
              ninja -C "build-$v" -k 0 -j4 $(cat tus.txt) > "run-$v-$r.log" 2>&1 || true
              e=$(date +%s.%N)
              echo "RESULT $v $r $(echo "$e - $s" | bc 2>/dev/null || python3 -c "print(round($e-$s,1))") failed=$(grep -c '^FAILED' run-$v-$r.log)"
            done
          done | tee results.txt
          python3 - <<'PY'
          import collections, statistics
          t = collections.defaultdict(list); bad = collections.defaultdict(int)
          for line in open("results.txt"):
              p = line.split()
              if len(p) >= 5 and p[0] == "RESULT":
                  t[p[1]].append(float(p[3])); bad[p[1]] += int(p[4].split("=")[1])
          base = statistics.median(t["gcc-base"]) if t.get("gcc-base") else None
          print("variant, runs, median s, min s, max s, vs gcc-base, failed edges")
          for v in sorted(t):
              m = statistics.median(t[v])
              print(f"{v:14s} {len(t[v])} {m:8.1f} {min(t[v]):8.1f} {max(t[v]):8.1f} {('%.2fx' % (m/base)) if base else '-'} {bad[v]}")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab13-flags
          path: |
            results.txt
            run-*.log
            warm-*.log
            configure-*.log
          compression-level: 6

  spawn:
    name: process spawn and cache-hit cost
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Defender exclusions
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath 'C:\msys64', "$env:GITHUB_WORKSPACE", 'D:\a', $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess 'gcc.exe','g++.exe','cc1plus.exe','ccache.exe','bash.exe','python.exe'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          release: false
          update: true
          install: wget
      - name: Tools
        shell: msys2 {0}
        run: |
          P=mingw-w64-ucrt-x86_64
          pacman -S --noconfirm --needed $P-gcc $P-ccache $P-nlohmann-json $P-openssl python
          ccache --version | head -1
      - name: Measure
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
          CCACHE_COMPILERCHECK: content
        run: |
          cd "$GITHUB_WORKSPACE"
          cat > t.cpp <<'CPP'
          #include <string>
          #include <vector>
          #include <map>
          #include <nlohmann/json.hpp>
          int f(const std::string &s) { nlohmann::json j = nlohmann::json::parse(s); return (int) j.size(); }
          CPP
          sed -i 's/^          //' t.cpp
          python3 - <<'PY'
          import os, subprocess, time, statistics
          def timeit(cmd, n=30, env=None):
              e = dict(os.environ); e.update(env or {})
              ts = []
              for _ in range(n):
                  s = time.perf_counter(); subprocess.run(cmd, env=e, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL); ts.append((time.perf_counter() - s) * 1000)
              return statistics.median(ts), min(ts), max(ts)
          def show(name, r): print(f"{name:58s} median {r[0]:7.1f} ms  min {r[1]:7.1f}  max {r[2]:7.1f}")
          cc = ["g++", "-std=c++23", "-O2", "-c", "t.cpp", "-o", "t.o", "-MD", "-MF", "t.d"]
          show("spawn: g++ --version", timeit(["g++", "--version"]))
          show("spawn: ccache --version", timeit(["ccache", "--version"]))
          show("spawn: python -c pass", timeit(["python3", "-c", "pass"]))
          show("compile miss-free baseline: g++ -E (preprocess only)", timeit(["g++", "-std=c++23", "-E", "t.cpp", "-o", "t.ii"], 10))
          show("compile: g++ -c (no ccache)", timeit(cc, 5))
          for label, env in (("direct (default)", {}), ("preprocessor mode (CCACHE_NODIRECT=1)", {"CCACHE_NODIRECT": "1"}), ("depend mode (CCACHE_DEPEND=1)", {"CCACHE_DEPEND": "1"})):
              env = dict(env, CCACHE_DIR=os.environ["CCACHE_DIR"] + "-" + label.split()[0])
              subprocess.run(["ccache"] + cc, env=dict(os.environ, **env))     # fill the cache for this mode
              show("ccache hit, " + label, timeit(["ccache"] + cc, 30, env))
          PY
