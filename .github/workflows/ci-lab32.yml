name: ci-lab32
# Fork-only: sharded parallel cold compile. One runner (base) against N = 2, 3 and 4 shards that fill a compiler cache each,
# and a final job per N that merges the shard caches (through the cache service or through artifacts), then builds at ~100% hits.
on:
  push:
    branches: ["ci/lab32-**"]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
defaults:
  run:
    shell: bash
jobs:
  n4w:
    uses: ./.github/workflows/ci-lab32-n.yml
    with: { count: 4, indices: '[0,1,2,3]', weights: true }
  n6w:
    uses: ./.github/workflows/ci-lab32-n.yml
    with: { count: 6, indices: '[0,1,2,3,4,5]', weights: true }
  n8w:
    uses: ./.github/workflows/ci-lab32-n.yml
    with: { count: 8, indices: '[0,1,2,3,4,5,6,7]', weights: true }
